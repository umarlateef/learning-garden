<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      color: #24292e;
      background: #fff;
      line-height: 1.6;
    }
    a { color: #0366d6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1, h2, h3 { margin-top: 1.5rem; margin-bottom: 0.75rem; }
    h1 { font-size: 2rem; border-bottom: 1px solid #eaecef; padding-bottom: 0.3rem; }
    h2 { font-size: 1.5rem; border-bottom: 1px solid #eaecef; padding-bottom: 0.3rem; }
    h3 { font-size: 1.25rem; }
    p { margin-bottom: 1rem; }
    ul, ol { margin-bottom: 1rem; padding-left: 2rem; }
    li { margin-bottom: 0.25rem; }
    code {
      background: #f6f8fa;
      padding: 0.15rem 0.35rem;
      border-radius: 3px;
      font-size: 0.9em;
    }
    pre {
      background: #f6f8fa;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 1rem;
    }
    pre code { background: none; padding: 0; }
    blockquote {
      border-left: 4px solid #dfe2e5;
      padding-left: 1rem;
      color: #6a737d;
      margin-bottom: 1rem;
    }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    th, td { border: 1px solid #dfe2e5; padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #f6f8fa; }
    hr { border: none; border-top: 1px solid #eaecef; margin: 1.5rem 0; }
    nav {
      background: #f6f8fa;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 2rem;
    }
    nav a { margin-right: 1rem; font-weight: 500; }
    .back-link {
      display: inline-block;
      margin-top: 2rem;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/">{{ site.title }}</a>
    {% assign dirs = site.source | append: "/" | append: "input" | split: "/" %}
    {% for section in site.data.nav | default: site.pages %}
    {% endfor %}
    <a href="/notes/">Notes</a>
    <a href="/books/">Books</a>
    <a href="/thoughts/">Thoughts</a>
    <a href="/zettelkasten/">Zettelkasten</a>
    <a href="/ideas/">Ideas</a>
  </nav>
  {{ content }}
  <a href="/{{ section | default: 'notes' }}/" class="back-link">&larr; Back to {{ section | default: 'notes' }} index</a>
  <footer style="margin-top:3rem;padding-top:1rem;border-top:1px solid #eaecef;font-size:0.85em;color:#6a737d;">
    Built with Jekyll &middot; GitHub Pages
  </footer>
</body>
</html>
